data:
  source_url: "futures_minute (6).csv"  # Local dataset file
  
indicators:
  rsi_period: 14
  bb_period: 20
  bb_std_dev: 2.0
  atr_period: 14
  sma_period: 200  # Trend filter

strategy:
  name: "Volatility Sniper v2.0"
  rsi_oversold: 25  # More extreme = fewer trades
  rsi_overbought: 75  # More extreme = fewer trades
  use_trend_filter: true
  
risk_management:
  stop_loss_multiplier: 2.5  # 2.5x ATR
  max_drawdown_pct: 0.15  # 15%
  risk_per_trade: 0.015  # 1.5% of capital per trade
  
backtesting:
  initial_capital: 100000
  slippage_pct: 0.001  # 0.1%
  transaction_cost_pct: 0.0005  # 0.05%
